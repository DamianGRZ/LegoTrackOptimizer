<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LEGO Track Optimizer (V2 port-pair)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0a1118;
    --panel: #121d2a;
    --panel-2: #16212f;
    --border: rgba(120,160,200,0.16);
    --text: #cfd9e6;
    --text-dim: #7d8a99;
    --accent: #7fb0ff;
    --warm: #ffb47a;
    --ok: #7be38b;
    --bad: #ff7a8a;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* header */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 28px; height: 28px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .logo-mark div {
    background: var(--accent);
    border-radius: 2px;
  }
  .logo-mark div:nth-child(1) { background: var(--accent); }
  .logo-mark div:nth-child(2) { background: var(--warm); }
  .logo-mark div:nth-child(3) { background: var(--warm); grid-column: 1 / span 2; height: 6px; align-self: end; }
  .logo-title { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
  .logo-sub { font-size: 11px; color: var(--text-dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .btn {
    appearance: none; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    padding: 8px 16px; border-radius: 6px; font: inherit;
    font-weight: 500; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: #0a1118; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.primary:disabled { background: #3a4a5e; border-color: #3a4a5e; color: #6b7888; cursor: not-allowed; }

  /* layout */
  .grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
  }
  .left { display: flex; flex-direction: column; min-height: 0; padding: 16px; gap: 12px; }
  .right {
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  }

  /* canvas / image area */
  .canvas-wrap {
    flex: 1; min-height: 0;
    background: #0e1620;
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .canvas-wrap canvas {
    flex: 1; min-height: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .canvas-wrap img {
    flex: 1; min-height: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: white;
  }
  .canvas-wrap .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px;
  }
  .canvas-caption {
    position: absolute; left: 12px; bottom: 44px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: var(--text-dim);
    pointer-events: none;
  }
  .canvas-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: var(--text-dim);
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    appearance: none; background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 4px 10px; border-radius: 4px;
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--accent); }

  /* cards */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card-hd {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .card-hd > span:first-child { color: var(--text); letter-spacing: 0.06em; }

  /* form rows in cards */
  .form-row {
    display: grid; grid-template-columns: 1fr 110px;
    align-items: center; gap: 8px; padding: 4px 0;
    font-size: 12px;
  }
  .form-row label { color: var(--text-dim); }
  .form-row input, .form-row select {
    background: #0a1118; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 8px; font: 12px ui-monospace, monospace;
    text-align: right; width: 100%;
  }
  .form-row input:focus, .form-row select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* scorecard */
  .kv-grid {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
  }
  .kv-grid .k { color: var(--text-dim); }
  .kv-grid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .pieces-used { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 8px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
  }
  .pill-n {
    background: var(--accent); color: #0a1118; padding: 1px 6px; border-radius: 3px;
    font-weight: 600;
  }
  .pill.pill-full .pill-n { background: var(--ok); }
  .pill.pill-empty { opacity: 0.55; }
  .pill.pill-empty .pill-n { background: var(--panel-2); color: var(--text-dim); }

  /* progress */
  .progress {
    display: flex; flex-direction: column; gap: 6px;
    font-family: ui-monospace, monospace; font-size: 11px;
  }
  .progress-line { color: var(--text-dim); }
  .progress-line.last { color: var(--text); }

  /* run state badge */
  .badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .badge.idle { background: var(--panel-2); color: var(--text-dim); }
  .badge.running { background: var(--warm); color: #0a1118; }
  .badge.done { background: var(--ok); color: #0a1118; }
  .badge.error { background: var(--bad); color: #0a1118; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .right { border-left: none; border-top: 1px solid var(--border); max-height: 60vh; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="geometry.js?v=10"></script>
  <script src="render.js?v=10"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=10"></script>
  <script type="text/babel" src="app.jsx?v=10"></script>
</body>
</html>
