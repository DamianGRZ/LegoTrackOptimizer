# LEGO/4DBrix Track Piece Catalog — V2 port-centric schema
# Source: data/track_pieces.yaml (v1 SECTION_TYPES form); derived per V2 spec.
# Units: studs internal; degrees in v1 source converted to radians below.
# FK values preserved verbatim — no geometry corrections in Phase 1.

meta:
  schema_version: "1.0.0"
  unit: stud
  stud_mm: 8.0
  angle_unit: rad
  atomic_angle_rad: 0.19634954                 # π/32 = 5.625°

pieces:
  # =========================================================================
  # STRAIGHTS
  # =========================================================================

  - piece_id: STRAIGHT_16
    kind: straight
    manufacturer: 4dbrix
    part_numbers: ["2.04.065"]
    length_studs: 16.0
    symmetric: true                              # flip is geometric no-op; allow for chromosome-symmetry handling
    ports:
      A: {dx: 0.0,  dy: 0.0, dtheta: 0.0}
      B: {dx: 16.0, dy: 0.0, dtheta: 0.0}
    routes:
      main: [A, B]

  - piece_id: STRAIGHT_24
    kind: straight
    manufacturer: 4dbrix
    part_numbers: ["2.04.066"]
    length_studs: 24.0
    symmetric: true
    ports:
      A: {dx: 0.0,  dy: 0.0, dtheta: 0.0}
      B: {dx: 24.0, dy: 0.0, dtheta: 0.0}
    routes:
      main: [A, B]

  # =========================================================================
  # CURVES (R40, 22.5°)
  # FK: dx = R*sin(θ), dy = R*(1-cos(θ)), dtheta = θ
  # θ = 22.5° = π/8 rad
  #
  # Single SKU (4DBrix 2.04.069 / LEGO 2867 / 53400 / 85976) — physically
  # achiral. Left vs right turn is selected per-placement via the
  # chromosome's flip bit; no separate L/R catalog entries.
  # =========================================================================

  - piece_id: R40_CURVE
    kind: curve
    manufacturer: 4dbrix
    part_numbers: ["2.04.069"]
    radius_studs: 40.0
    sector_angle_rad: 0.39269908                # π/8
    symmetric: true                             # flip bit selects L vs R turn
    ports:
      A: {dx: 0.0,     dy: 0.0,    dtheta: 0.0}
      B: {dx: 15.307,  dy: 3.045,  dtheta: 0.39269908}
    routes:
      main: [A, B]

  # =========================================================================
  # SWITCHES (R40, 22.5°)
  #
  # Two SKUs total — left-handed and right-handed. The "IN" vs "OUT" form is
  # a *placement orientation* (the same brick rotated 180° in plane), not a
  # different physical part. The chromosome's per-slot rotate bit selects
  # between the canonical (IN, frog at far end) and rotated (OUT, frog at
  # throat-end) placements. See research notes 2026-04 (curves + switches).
  #
  # Canonical pose: throat at port A (origin), straight-through exit at port
  # B (far end), diverging exit at port C (near far end, off-axis on the
  # hand side). 4DBrix part numbers cover both inside-throw and outside-throw
  # lever variants — the rail geometry is identical, so we list both.
  # =========================================================================

  - piece_id: R40_SWITCH_LEFT
    kind: switch
    manufacturer: 4dbrix
    part_numbers: ["2.04.021", "2.04.022"]              # inside / outside throw
    body_length_studs: 32.0
    diverging_radius_studs: 40.0
    hand: left
    rotatable: true                                     # rotate=1 → OUT placement
    ports:
      A: {dx: 0.0,    dy: 0.0,    dtheta: 0.0}          # throat
      B: {dx: 32.0,   dy: 0.0,    dtheta: 0.0}          # straight through
      C: {dx: 31.0,   dy: 6.2,    dtheta: 0.39269908}   # diverging (left)
    routes:
      through:   [A, B]
      diverging: [A, C]

  - piece_id: R40_SWITCH_RIGHT
    kind: switch
    manufacturer: 4dbrix
    part_numbers: ["2.04.018", "2.04.019"]              # inside / outside throw
    body_length_studs: 32.0
    diverging_radius_studs: 40.0
    hand: right
    rotatable: true
    ports:
      A: {dx: 0.0,    dy:  0.0,    dtheta:  0.0}
      B: {dx: 32.0,   dy:  0.0,    dtheta:  0.0}
      C: {dx: 31.0,   dy: -6.2,    dtheta: -0.39269908}
    routes:
      through:   [A, B]
      diverging: [A, C]

  # =========================================================================
  # CROSSINGS
  # =========================================================================

  - piece_id: CROSS_90
    kind: crossing
    manufacturer: 4dbrix
    part_numbers: ["2.04.002"]
    length_studs: 16.0
    ports:
      A: {dx: 0.0,  dy:  0.0,  dtheta:  0.0}                # west (port 0 entry)
      B: {dx: 16.0, dy:  0.0,  dtheta:  0.0}                # east (port 1)
      C: {dx: 8.0,  dy: -8.0,  dtheta: -1.57079633}         # south (port 2), -π/2
      D: {dx: 8.0,  dy:  8.0,  dtheta:  1.57079633}         # north (port 3), +π/2
    routes:
      horizontal: [A, B]
      vertical:   [C, D]

  - piece_id: DOUBLE_CROSSOVER
    kind: crossing
    manufacturer: 4dbrix
    part_numbers: ["210.1"]
    length_studs: 48.0
    ports:
      A: {dx: 0.0,  dy:  0.0,  dtheta: 0.0}    # entry_track1
      B: {dx: 48.0, dy:  0.0,  dtheta: 0.0}    # exit_track1
      C: {dx: 0.0,  dy: 16.0,  dtheta: 0.0}    # entry_track2
      D: {dx: 48.0, dy: 16.0,  dtheta: 0.0}    # exit_track2
    routes:
      track1_through: [A, B]
      track2_through: [C, D]
      cross_1_to_2:   [A, D]
      cross_2_to_1:   [C, B]
