# LEGO/4DBrix Track Piece Catalog
# Source: Raw_trackPieces_info.md, 4DBrix product pages
# Units: studs (1 stud = 8mm), degrees (CCW positive)

metadata:
  version: "2.0"
  distance_unit: "studs"
  angle_unit: "degrees"
  stud_mm: 8.0
  track_width: 8
  rail_gauge: 5
  parallel_spacing: 16

# =============================================================================
# STRAIGHT TRACKS
# =============================================================================

straights:
  - id: "STRAIGHT_16"
    part_number: "2.04.065"
    name: "Full Straight Track"
    length: 16.0
    fk: {dx: 16.0, dy: 0.0, dtheta: 0.0}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [16.0, 0.0], heading: 0.0, gender: "M"}

  - id: "STRAIGHT_24"
    part_number: "2.04.066"
    name: "24 Stud Long Straight Track"
    length: 24.0
    fk: {dx: 24.0, dy: 0.0, dtheta: 0.0}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [24.0, 0.0], heading: 0.0, gender: "M"}
# =============================================================================
# CURVED TRACKS
# FK computed: dx = R*sin(θ), dy = R*(1-cos(θ)), dtheta = θ
# =============================================================================

curves:
  # R40 - LEGO Standard
  - id: "R40_LEFT"
    part_number: "2.04.069"
    name: "R40 Curved Track"
    radius: 40.0
    angle: 22.5
    direction: "left"
    fk: {dx: 15.307, dy: 3.045, dtheta: 22.5}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [15.307, 3.045], heading: 22.5, gender: "M"}
    closure: {pieces_per_circle: 16, pieces_per_90: 4}
    physics: {radius_mm: 320, speed_limit_ms: 0.97}

  - id: "R40_RIGHT"
    part_number: "2.04.069"
    name: "R40 Curved Track"
    radius: 40.0
    angle: 22.5
    direction: "right"
    fk: {dx: 15.307, dy: -3.045, dtheta: -22.5}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [15.307, -3.045], heading: -22.5, gender: "M"}
    closure: {pieces_per_circle: 16, pieces_per_90: 4}
    physics: {radius_mm: 320, speed_limit_ms: 0.97}
# =============================================================================
# R40 SWITCH COMPONENTS (Modular System)
# =============================================================================

r40_switch_components:
  # Switch tracks - 32 studs long (matches LEGO 53407/53404 and 4DBrix 212.x)
  # Each switch has two routes: straight-through (route 0) and diverge (route 1)
  # Route 0 = straight through, Route 1 = diverge to branch
  # Geometry: ~8 stud straight entry + R40 curve (22.5°) + ~8 stud straight exit
  # Diverge FK: dx ≈ 31.0, dy ≈ ±6.2, dtheta = ±22.5°

  - id: "R40_SWITCH_RIGHT_IN"
    part_number: "2.04.018"
    name: "Switch Track - Right Turn, Inside Ground Throw"
    length: 32.0
    radius: 40.0
    turn: 22.5
    direction: "right"
    fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}  # Default: straight-through
    routes:
      - name: "straight"
        entry_port: 0
        exit_port: 1
        fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "diverge"
        entry_port: 0
        exit_port: 2
        fk: {dx: 31.0, dy: -6.2, dtheta: -22.5}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [32.0, 0.0], heading: 0.0, gender: "M"}
      - {pos: [31.0, -6.2], heading: -22.5, gender: "M"}

  - id: "R40_SWITCH_RIGHT_OUT"
    part_number: "2.04.019"
    name: "Switch Track - Right Turn, Outside Ground Throw"
    length: 32.0
    radius: 40.0
    turn: 22.5
    direction: "right"
    fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}  # Default: straight-through
    routes:
      - name: "straight"
        entry_port: 0
        exit_port: 1
        fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "merge"
        entry_port: 2
        exit_port: 1
        fk: {dx: 31.0, dy: 6.2, dtheta: 22.5}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [32.0, 0.0], heading: 0.0, gender: "M"}
      - {pos: [1.0, -6.2], heading: -22.5, gender: "F"}

  - id: "R40_SWITCH_LEFT_IN"
    part_number: "2.04.021"
    name: "Switch Track - Left Turn, Inside Ground Throw"
    length: 32.0
    radius: 40.0
    turn: 22.5
    direction: "left"
    fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}  # Default: straight-through
    routes:
      - name: "straight"
        entry_port: 0
        exit_port: 1
        fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "diverge"
        entry_port: 0
        exit_port: 2
        fk: {dx: 31.0, dy: 6.2, dtheta: 22.5}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [32.0, 0.0], heading: 0.0, gender: "M"}
      - {pos: [31.0, 6.2], heading: 22.5, gender: "M"}

  - id: "R40_SWITCH_LEFT_OUT"
    part_number: "2.04.022"
    name: "Switch Track - Left Turn, Outside Ground Throw"
    length: 32.0
    radius: 40.0
    turn: 22.5
    direction: "left"
    fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}  # Default: straight-through
    routes:
      - name: "straight"
        entry_port: 0
        exit_port: 1
        fk: {dx: 32.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "merge"
        entry_port: 2
        exit_port: 1
        fk: {dx: 31.0, dy: -6.2, dtheta: -22.5}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F"}
      - {pos: [32.0, 0.0], heading: 0.0, gender: "M"}
      - {pos: [1.0, 6.2], heading: 22.5, gender: "F"}

# =============================================================================
# CROSSINGS AND SPECIAL PIECES
# =============================================================================

crossings:
  # 90° crossing has two independent routes that don't interact
  # Both routes are straight-through (no turning)
  # Port convention: entry port at (0,0) like all other pieces
  # Route 0 (default): horizontal west-to-east
  # Route 1: vertical south-to-north (perpendicular, for figure-8 layouts)
  - id: "CROSS_90"
    part_number: "2.04.002"
    name: "90 Degree Cross Track"
    length: 16.0
    width: 16.0
    type: "passive"
    fk: {dx: 16.0, dy: 0.0, dtheta: 0.0}  # Default: horizontal route
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F", role: "west"}      # Port 0 - entry
      - {pos: [16.0, 0.0], heading: 0.0, gender: "M", role: "east"}     # Port 1 - exit
      - {pos: [8.0, -8.0], heading: -90.0, gender: "F", role: "south"}  # Port 2 - perpendicular entry
      - {pos: [8.0, 8.0], heading: 90.0, gender: "M", role: "north"}    # Port 3 - perpendicular exit
    routes:
      - name: "horizontal"
        entry_port: 0  # west
        exit_port: 1   # east
        fk: {dx: 16.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "vertical"
        entry_port: 2  # south
        exit_port: 3   # north
        fk: {dx: 16.0, dy: 0.0, dtheta: 0.0}  # In train's frame (entering north, going straight)
        physics: {radius_mm: null, speed_limit_ms: 1.57}

  # Double Crossover - allows trains to cross between parallel tracks
  # Footprint: 48 studs long x 24 studs wide (physical bounding box)
  # Track centerlines: 16 studs apart (standard parallel_spacing)
  - id: "DOUBLE_CROSSOVER"
    set_number: "210.1"
    name: "R40 Double Crossover"
    footprint: {length: 48, width: 24}
    track_spacing: 16
    fk: {dx: 48.0, dy: 0.0, dtheta: 0.0}  # Default: track1 straight through
    ports:
      - {pos: [0.0, 0.0], heading: 0.0, gender: "F", role: "entry_track1"}
      - {pos: [48.0, 0.0], heading: 0.0, gender: "M", role: "exit_track1"}
      - {pos: [0.0, 16.0], heading: 0.0, gender: "F", role: "entry_track2"}
      - {pos: [48.0, 16.0], heading: 0.0, gender: "M", role: "exit_track2"}
    routes:
      - name: "track1_through"
        entry_port: 0
        exit_port: 1
        fk: {dx: 48.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "track2_through"
        entry_port: 2
        exit_port: 3
        fk: {dx: 48.0, dy: 0.0, dtheta: 0.0}
        physics: {radius_mm: null, speed_limit_ms: 1.57}
      - name: "cross_1_to_2"
        entry_port: 0
        exit_port: 3
        fk: {dx: 48.0, dy: 16.0, dtheta: 0.0}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}
      - name: "cross_2_to_1"
        entry_port: 2
        exit_port: 1
        fk: {dx: 48.0, dy: -16.0, dtheta: 0.0}
        physics: {radius_mm: 320, speed_limit_ms: 0.97}

# =============================================================================
# PIECE INDEX (for pymoo chromosome encoding)
# =============================================================================

piece_index:
  # Straights
  0: "STRAIGHT_16"
  1: "STRAIGHT_24"
  # Curves
  2: "R40_LEFT"
  3: "R40_RIGHT"
  # Crossings
  4: "CROSS_90"
  9: "DOUBLE_CROSSOVER"
  # Switches (straight-through FK)
  5: "R40_SWITCH_LEFT_IN"
  6: "R40_SWITCH_LEFT_OUT"
  7: "R40_SWITCH_RIGHT_IN"
  8: "R40_SWITCH_RIGHT_OUT"
  # Sentinel
  -1: null
