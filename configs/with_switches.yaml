# LEGO Track Optimizer - Configuration with Switches
# Includes R40 switch tracks for layouts with turnout points

train_config_path: trains/default.yaml

inventory:
  # Straights
  #STRAIGHT_24: 8
  STRAIGHT_16: 80
  # R40 curves
  R40_LEFT: 40
  R40_RIGHT: 40
  # R40 Switches (straight-through mode in optimizer)
  R40_SWITCH_LEFT_IN: 2
  R40_SWITCH_LEFT_OUT: 2
#  R40_SWITCH_RIGHT_IN: 4
#  R40_SWITCH_RIGHT_OUT: 4

boundary:
  min_x: -250.0
  max_x: 250.0
  min_y: -250.0
  max_y: 250.0

#boundary:
#  min_x: -100.0
#  max_x: 100.0
#  min_y: -100.0
#  max_y: 100.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 500
  heuristic_ratio: 0.20
  crossover_prob: 0.01
  mutation_prob: 0.8
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 100  # Early stop if no improvement for 100 generations

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 32  # Enable parallel evaluation
