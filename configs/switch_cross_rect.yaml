# Sidings + crossing — wide boundary, no DC.
# Two switch pairs and two 90-degree crossings let the GA combine passing sidings
# on the straights with a self-crossing in the middle. A 420 x 260 box has room
# for both. Complements all_pieces by excluding the double-crossover, so the mix
# is siding + CROSS_90 only.

train_config_path: trains/default.yaml

inventory:
  STRAIGHT_16: 120
  R40_CURVE: 56
  R40_SWITCH_LEFT: 2
  R40_SWITCH_RIGHT: 2
  CROSS_90: 2

boundary:
  min_x: -210.0
  max_x: 210.0
  min_y: -130.0
  max_y: 130.0

algorithm:
  name: NSGA2
  pop_size: 800
  n_gen: 250
  heuristic_ratio: 0.30
  crossover_prob: 0.8
  mutation_prob: 0.2
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 0

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
special_piece_weight: 6.0
n_workers: 16
