# LEGO Track Optimizer - with_crossing, mutation-only variant (§9.7 sanity / Rule 25 revised)
#
# Variant of with_crossing.yaml with crossover disabled and mutation maxed.
# See default_only_mutation.yaml for the rule rationale.

train_config_path: trains/measured_consist.yaml

inventory:
  # Straights
  # STRAIGHT_24: 8
  STRAIGHT_16: 40
  # R40 curves: single SKU; flip bit selects L/R per placement.
  R40_CURVE: 40
  # 90-degree crossing (allows track to cross itself)
  CROSS_90: 20

boundary:
  min_x: -200.0
  max_x: 200.0
  min_y: -200.0
  max_y: 200.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 500
  heuristic_ratio: 0.20
  crossover_prob: 0.0    # was 0.9 — Rule 25 revised (Holland 1975 + Barrero 2014)
  mutation_prob: 1.0     # was 0.1 — compensate for absent crossover diversity
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 100

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 16            # was 1 — bumped for sanity-run wall-clock
