# LEGO Track Optimizer - Compact Configuration
# Tight boundaries for space-constrained layouts

inventory:
  # Shorter straights preferred
  STRAIGHT_16: 8
  # R40 curves for tight turns
  R40_LEFT: 16

boundary:
  # Tight space constraints
  min_x: -100.0
  max_x: 60.0
  min_y: -100.0
  max_y: 60.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 300
  heuristic_ratio: 0.08
  crossover_prob: 0.9
  mutation_prob: 0.1
  eliminate_duplicates: true
  seed: null

physics:
  safety_factor: 0.8
  friction_coeff: 0.30
  gravity: 9.81
  motor_top_speed: 1.57
  max_accel: 3.92
  brake_decel: 2.45
  stud_mm: 8.0

closure_tolerance: 0.5
angle_tolerance: 5.0
n_workers: 1
