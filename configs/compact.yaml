# LEGO Track Optimizer - Compact Configuration
# Tight boundaries for space-constrained layouts

train_config_path: trains/measured_consist.yaml

inventory:
  # Shorter straights preferred
  STRAIGHT_16: 8
  # R40 curves for tight turns (single SKU; flip bit selects L/R)
  R40_CURVE: 16

boundary:
  # Tight space constraints
  min_x: -100.0
  max_x: 60.0
  min_y: -100.0
  max_y: 60.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 300
  heuristic_ratio: 0.20
  crossover_prob: 0.9
  mutation_prob: 0.1
  eliminate_duplicates: true
  seed: null

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 1
