# LEGO Track Optimizer - Default Configuration
# Rich inventory with plenty of all piece types

train_config_path: trains/default.yaml

inventory:
  # Straights
  STRAIGHT_24: 8
  STRAIGHT_16: 24
  # R40 curves: single SKU (4DBrix 2.04.069). Left vs right turn is selected
  # per-placement via the chromosome's flip bit. 40 = 20 ex-left + 20 ex-right.
  R40_CURVE: 40

boundary:
  min_x: -150.0
  max_x: 150.0
  min_y: -150.0
  max_y: 150.0

algorithm:
  name: RNSGA2
  pop_size: 1000
  n_gen: 200
  heuristic_ratio: 0.20
  crossover_prob: 0.2
  mutation_prob: 0.8
  eliminate_duplicates: true
  seed: null

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 1
