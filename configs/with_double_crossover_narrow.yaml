# Narrow-tall variant of with_double_crossover.yaml.
# A 110-stud wide × 240-stud tall boundary fits the figure-8 (96 × 176)
# but excludes wider racetrack/oval topologies, so the figure-8 around a
# DOUBLE_CROSSOVER is competitive on utilisation.

train_config_path: trains/measured_consist.yaml

inventory:
  STRAIGHT_16: 40
  R40_CURVE: 48
  DOUBLE_CROSSOVER: 2

boundary:
  min_x: -55.0
  max_x: 55.0
  min_y: -120.0
  max_y: 120.0

algorithm:
  name: NSGA2
  pop_size: 300
  n_gen: 80
  heuristic_ratio: 0.30
  crossover_prob: 0.2
  mutation_prob: 0.8
  eliminate_duplicates: true
  seed: 42

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 32
