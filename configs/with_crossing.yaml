# LEGO Track Optimizer - Configuration with 90-Degree Crossing
# Adds CROSS_90 for figure-8 / self-intersecting layouts. No switches/DC here —
# use with_switches_and_crossing for switches+crossing, all_pieces for the full kit.

train_config_path: trains/measured_consist.yaml

inventory:
  # Straights
  #STRAIGHT_24: 8
  STRAIGHT_16: 120
  # R40 curves
  R40_CURVE: 80
  # 90-degree crossing (allows track to cross itself)
  CROSS_90: 2
boundary:
  min_x: -250.0
  max_x: 250.0
  min_y: -250.0
  max_y: 250.0

#boundary:
#  min_x: -100.0
#  max_x: 100.0
#  min_y: -100.0
#  max_y: 100.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 300
  heuristic_ratio: 0.20
  crossover_prob: 0.95
  mutation_prob: 0.05
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 0  # 0 = no improvement-based early stop; run the full generation budget

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 16  # Enable parallel evaluation
