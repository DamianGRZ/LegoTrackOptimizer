inventory:
  # Straights
  # STRAIGHT_24: 8
  STRAIGHT_16: 40
  # R40 curves: single SKU; flip bit selects L/R per placement.
  R40_CURVE: 40
  # 90-degree crossing (allows track to cross itself)
  CROSS_90: 20

#boundary:
#  min_x: -100.0
#  max_x: 100.0
#  min_y: -100.0
#  max_y: 100.0

boundary:
  min_x: -200.0
  max_x: 200.0
  min_y: -200.0
  max_y: 200.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 500
  heuristic_ratio: 0.20
  crossover_prob: 0.9
  mutation_prob: 0.1
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 100  # Early stop if no improvement for 100 generations

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
n_workers: 1
