# LEGO Track Optimizer - with_switches, mutation-only variant (§9.7 sanity / Rule 25 revised)
#
# Variant of with_switches.yaml with crossover disabled and mutation maxed.
# This config IS the §9.7 hard blocker: feasibility ≥ 500/1000 here proves
# Part 9's schema-disruption diagnosis; below 500 means re-plan Part 9
# before touching Phase 1+ code.
#
# See default_only_mutation.yaml for the rule rationale (Holland 1975 +
# Barrero 2014). Canonical with_switches.yaml stays at cx=0.9/mut=0.1.

train_config_path: trains/measured_consist.yaml

inventory:
  # Straights
  #STRAIGHT_24: 8
  STRAIGHT_16: 80
  # R40 curves: single SKU; flip bit selects L/R per placement.
  R40_CURVE: 80
  # R40 Switches: two SKUs (left-handed, right-handed). The chromosome's
  # rotate bit selects IN-style vs OUT-style placement of the same brick.
  # A passing siding uses ONE LEFT + ONE RIGHT (the IN/OUT switches of a
  # real LEGO siding are opposite handedness — the rotated handed switch
  # puts the diverging port back on the same side of the mainline as the
  # branch). Stock both so the GA can build either-side sidings.
  R40_SWITCH_LEFT: 4
  R40_SWITCH_RIGHT: 4

boundary:
  min_x: -250.0
  max_x: 250.0
  min_y: -250.0
  max_y: 250.0

algorithm:
  name: NSGA2
  pop_size: 1000
  n_gen: 500
  heuristic_ratio: 0.20
  crossover_prob: 0.0    # was 0.9 — Rule 25 revised (Holland 1975 + Barrero 2014)
  mutation_prob: 1.0     # was 0.1 — compensate for absent crossover diversity
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 100

# Main loop tolerance back to 4.0 (tight) — the 7.0 workaround is no
# longer needed now that branch cycles are detected via branch_labels and
# given their own loosened tolerance below.
closure_tolerance: 4.0
# Branch (siding) cycles get a separate looser tolerance: R40 + STRAIGHT_16
# passing sidings have an inherent ~6-stud y-residual that physical LEGO
# track absorbs via flex.
branch_closure_tolerance: 8.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
# Sweet spot for i7-14700F (20 physical cores). ProcessPool overhead +
# serial bottlenecks cap practical speedup at ~1.3x even with all cores.
n_workers: 16
