# CROSS_90 figure-8 — tall boundary.
# Same crossing-only kit as cross_figure8_wide but a 200 x 360 box, so the two
# lobes stack vertically instead of side by side. Pairs with the wide variant to
# show the figure-8 reorienting with the boundary aspect ratio.

train_config_path: trains/measured_consist.yaml

inventory:
  STRAIGHT_16: 100
  R40_CURVE: 48
  CROSS_90: 2

boundary:
  min_x: -100.0
  max_x: 100.0
  min_y: -180.0
  max_y: 180.0

algorithm:
  name: NSGA2
  pop_size: 700
  n_gen: 250
  heuristic_ratio: 0.30
  crossover_prob: 0.95
  mutation_prob: 0.05
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 0

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
special_piece_weight: 6.0
n_workers: 16
