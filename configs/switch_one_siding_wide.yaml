# One passing siding — wide boundary.
# A single opposite-handed switch pair (1 LEFT + 1 RIGHT), no crossing/DC, so the
# only multi-path topology is one passing siding branching off a horizontal oval.
# The 400 x 240 box is wide for the siding's IN -> straights -> OUT run AND tall
# enough for the parallel branch to fit inside the boundary — a too-short box makes
# every siding layout bust the boundary and stay infeasible.

train_config_path: trains/default.yaml

inventory:
  STRAIGHT_16: 90
  R40_CURVE: 40
  # One passing siding = 1 LEFT + 1 RIGHT (opposite-handed pair).
  R40_SWITCH_LEFT: 1
  R40_SWITCH_RIGHT: 1

boundary:
  min_x: -200.0
  max_x: 200.0
  min_y: -120.0
  max_y: 120.0

algorithm:
  name: NSGA2
  pop_size: 600
  n_gen: 200
  heuristic_ratio: 0.30
  crossover_prob: 0.8
  mutation_prob: 0.2
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 0

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
special_piece_weight: 6.0
n_workers: 16
