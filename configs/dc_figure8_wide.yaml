# DOUBLE_CROSSOVER figure-8 — wide boundary.
# Two double-crossovers and no switches/CROSS_90: the only single-loop DC
# topology that closes is the figure-8 whose crossing IS the DC body. A 360 x 220
# box gives the figure-8 (~96 x 176) room — height >= 200 so the DC heuristic seed
# fires — while staying tight enough to keep it competitive against plain ovals.

train_config_path: trains/measured_consist.yaml

inventory:
  STRAIGHT_16: 80
  R40_CURVE: 48
  DOUBLE_CROSSOVER: 2

boundary:
  min_x: -180.0
  max_x: 180.0
  min_y: -110.0
  max_y: 110.0

algorithm:
  name: NSGA2
  pop_size: 600
  n_gen: 250
  heuristic_ratio: 0.30
  crossover_prob: 0.9
  mutation_prob: 0.1
  eliminate_duplicates: true
  seed: null
  termination:
    n_max_gen: 1000
    period: 0

closure_tolerance: 4.0
angle_tolerance: 5.0
boundary_tolerance: 2.0
special_piece_weight: 6.0
n_workers: 16
