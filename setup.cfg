[pycodestyle]
max-line-length = 99
# `ignore` replaces pycodestyle's default list, so the defaults are re-listed
# here. E203 is added on top: slice colons (x[start : end + 1]) follow PEP 8's
# binary-operator spacing rule and must not be "fixed".
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203