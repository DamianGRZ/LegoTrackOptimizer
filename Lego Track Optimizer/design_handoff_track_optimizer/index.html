<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LEGO Track Optimizer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0a1118;
    --panel: #121d2a;
    --panel-2: #16212f;
    --border: rgba(120,160,200,0.16);
    --text: #cfd9e6;
    --text-dim: #7d8a99;
    --accent: #7fb0ff;
    --warm: #ffb47a;
    --ok: #7be38b;
    --bad: #ff7a8a;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* header */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 28px; height: 28px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .logo-mark div {
    background: var(--accent);
    border-radius: 2px;
  }
  .logo-mark div:nth-child(1) { background: var(--accent); }
  .logo-mark div:nth-child(2) { background: var(--warm); }
  .logo-mark div:nth-child(3) { background: var(--warm); grid-column: 1 / span 2; height: 6px; align-self: end; }
  .logo-title { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
  .logo-sub { font-size: 11px; color: var(--text-dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .btn {
    appearance: none; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    padding: 8px 16px; border-radius: 6px; font: inherit;
    font-weight: 500; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: #0a1118; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.primary:disabled { background: #3a4a5e; border-color: #3a4a5e; color: #6b7888; cursor: not-allowed; }
  .btn.ghost { background: transparent; }

  /* layout */
  .grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
  }
  .left { display: flex; min-height: 0; padding: 16px; }
  .right {
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  }

  /* canvas */
  .canvas-wrap {
    flex: 1; min-height: 0;
    background: #0e1620;
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .canvas-wrap canvas {
    flex: 1; min-height: 0;
    display: block;
  }
  .canvas-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: var(--text-dim);
  }

  /* cards */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card-hd {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .card-hd > span:first-child { color: var(--text); letter-spacing: 0.06em; }

  /* scorecard */
  .kv-grid {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
  }
  .kv-grid .k { color: var(--text-dim); }
  .kv-grid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .pieces-used { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 8px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
  }
  .pill-n {
    background: var(--accent); color: #0a1118; padding: 1px 6px; border-radius: 3px;
    font-weight: 600;
  }

  /* tests */
  .tests { display: flex; flex-direction: column; gap: 4px; }
  .test-row {
    display: grid; grid-template-columns: 8px 1fr auto;
    align-items: center; gap: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--text);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .test-name { color: var(--text); }
  .test-detail { color: var(--text-dim); font-size: 10.5px; max-width: 140px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* json editor */
  .json-edit {
    width: 100%;
    background: #0a1118; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px;
    font: 11px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    resize: vertical;
  }
  .json-edit:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  .prose { font-size: 12px; color: var(--text-dim); margin: 0; }
  .prose code {
    font: 11px ui-monospace, monospace;
    background: var(--panel-2); padding: 1px 5px; border-radius: 3px; color: var(--text);
  }

  /* responsive: stack on narrow */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .right { border-left: none; border-top: 1px solid var(--border); max-height: 60vh; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="geometry.js?v=2"></script>
  <script src="catalog.js?v=2"></script>
  <script src="search.js?v=2"></script>
  <script src="tests.js?v=2"></script>
  <script src="render.js?v=2"></script>
  <script type="text/babel" src="app.jsx?v=2"></script>
</body>
</html>
